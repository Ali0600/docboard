name: privacy

# A PR's own commits (messages, authors, added lines) and its title and body: paths and email
# addresses only, since the private terms exist only on the owner's machines (the pre-push hook
# checks those). Its own workflow, so editing a PR's title or body re-runs this alone, not the
# three-OS gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  privacy-text:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.14"
      # Dependabot's commits quote third-party release notes, so they are left out; anyone
      # else's commit pushed onto its branch is still scanned.
      - name: The PR's commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          uv run --frozen docboard privacy --commits "$BASE_SHA..$HEAD_SHA"
          --skip-author "dependabot[bot]"
      - name: The PR's title and body
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | uv run --frozen docboard privacy --stdin
